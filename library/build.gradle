plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    namespace "com.phantomvk.identifier"
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        languageVersion = '1.6'
        apiVersion = '1.6'
        freeCompilerArgs += [
                '-Xjvm-default=all-compatibility',
                '-Xmetadata-version=1.6.0',
                '-Xsuppress-version-warnings',
        ]
    }
}

dependencies {
    implementation "androidx.annotation:annotation:$annotation"
    compileOnly project(":dependencies")

    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.6.21"

//    compileOnly("com.huawei.hms:ads-identifier:$hms")
//    compileOnly("com.hihonor.mcs:ads-identifier:$mcs")

    testImplementation "junit:junit:$junit"
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:1.6.21"
    androidTestImplementation "androidx.test.ext:junit:$android_junit"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_core"
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "com.phantomvk.identifier"
                artifactId = 'identifier'
                version = rootProject.ext.versionName
            }
        }
    }
}
